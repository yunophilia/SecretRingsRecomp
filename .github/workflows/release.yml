# Builds and publishes a release when a version tag (v*.*.*) is pushed.
#
# The recompiled code is generated from the game's main.dol, which is not in this
# repository: the workflow reads it (with the other build inputs) from a private
# repository using the PRIVATE_FILES_TOKEN secret of the "release" environment (a
# fine-grained token with read-only Contents access to that repository). Nothing from it is uploaded or published; only
# the built exe goes into the release.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write   # create the release

jobs:
  build:
    runs-on: windows-2025
    # PRIVATE_FILES_TOKEN is an environment secret: the job only gets it once a
    # required reviewer approves the run.
    environment: release
    steps:
      - uses: actions/checkout@v4

      - name: Fetch build inputs (private)
        uses: actions/checkout@v4
        with:
          repository: yunophilia/SecretRingsRecomp-private
          token: ${{ secrets.PRIVATE_FILES_TOKEN }}
          path: private-inputs

      - name: Place build inputs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force game/extracted/DATA/sys, game/extracted/DATA/files, out | Out-Null
          Copy-Item private-inputs/sys/main.dol game/extracted/DATA/sys/
          Copy-Item private-inputs/files/SONICRINGS.sel, private-inputs/files/hbm_part.rso game/extracted/DATA/files/
          # a memory dump with the linked hbm_part.rso module (tools/rso.py), optional
          foreach ($d in 'mem1_dump.bin', 'mem2_dump.bin') { if (Test-Path private-inputs/$d) { Copy-Item private-inputs/$d out/ } }
          # the European release's main.dol (a separate build), optional
          if (Test-Path private-inputs/RSRP8P/sys/main.dol) {
            New-Item -ItemType Directory -Force game/inputs/RSRP8P/sys, game/inputs/RSRP8P/files | Out-Null
            Copy-Item private-inputs/RSRP8P/sys/main.dol game/inputs/RSRP8P/sys/
            Copy-Item private-inputs/RSRP8P/files/SONICRINGS.sel game/inputs/RSRP8P/files/
            if (Test-Path private-inputs/RSRP8P/mem1_dump.bin) {
              New-Item -ItemType Directory -Force out/eu | Out-Null
              Copy-Item private-inputs/RSRP8P/mem1_dump.bin out/eu/
            }
          }
          Remove-Item -Recurse -Force private-inputs

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate the recompiled code
        shell: pwsh
        run: |
          # the hbm_part.rso module is recompiled only when a memory dump is there
          if ((Test-Path out/mem1_dump.bin) -or (Test-Path out/mem2_dump.bin)) { python tools/rso.py }
          if (Test-Path out/eu/mem1_dump.bin) { python tools/rso.py out/eu/mem1_dump.bin --out out/eu }
          python tools/build_generated.py

      - name: Build
        shell: cmd
        env:
          SRR_VERSION: ${{ github.ref_name }}   # shown in the launcher and the overlay
        run: |
          call tools\dev_build.bat || (type out\build.log & exit /b 1)

      - name: Package
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File tools/package.ps1
          $zip = "SecretRingsRecomp-${{ github.ref_name }}-windows-x64.zip"
          Compress-Archive -Path dist/SecretRingsRecomp -DestinationPath $zip
          "ZIP=$zip" >> $env:GITHUB_ENV

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # one line per paragraph: release notes keep single line breaks. Edit the notes on
          # the release page afterwards to add what changed.
          $versions = if (Test-Path generated/eu) { "the USA (RSRE8P), European (RSRP8P) or Japanese (RSRJ8P) version" } else { "the USA (RSRE8P) or Japanese (RSRJ8P) version" }
          $notes = @"
          Sonic and the Secret Rings (Wii), statically recompiled to run natively on Windows.

          **This release contains no game data.** You need your own copy of $versions as a disc image: ISO, RVZ, WIA or WBFS. Unzip, start ``SecretRingsRecomp.exe`` and select the image when the launcher asks; the game data is installed next to the exe.

          See the [README](https://github.com/${{ github.repository }}#readme) for controls and settings.
          "@
          gh release create "${{ github.ref_name }}" "$env:ZIP" --title "${{ github.ref_name }}" --notes $notes
